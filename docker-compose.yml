services:
  zotprime-db:
    image: "uniuu/zotprime-db:${VER}"
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQLROOTPASSWORD}
      - MARIADB_DATABASE=${MYSQLDATABASE}
      - MARIADB_USER=${MYSQLUSER}
      - MARIADB_PASSWORD=${MYSQLPASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p${MYSQLROOTPASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      zotprime:
        ipv4_address: 10.5.5.2
  zotprime-elasticsearch:
    image: "uniuu/zotprime-elasticsearch:${VER}"
    mem_limit: 1024m
    mem_reservation: 1024m
    environment:
      - cluster.name=zotero
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false 
      - discovery.type=single-node
      - logger.level=WARN
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      zotprime:
        ipv4_address: 10.5.5.3
  zotprime-redis:
    image: "uniuu/zotprime-redis:${VER}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      zotprime:
        ipv4_address: 10.5.5.4
  zotprime-memcached:
    image: "uniuu/zotprime-memcached:${VER}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w1 localhost 11211 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      zotprime:
        ipv4_address: 10.5.5.5
  zotprime-localstack:
    image: "uniuu/zotprime-localstack:${VER}"
    environment:
      - SERVICES=sns,sqs,apigateway
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      zotprime:
        ipv4_address: 10.5.5.6
  zotprime-minio:
    image: "uniuu/zotprime-minio:${VER}"
    environment:
      - MINIO_ROOT_USER=${MINIOROOTUSER}
      - MINIO_ROOT_PASSWORD=${MINIOROOTPASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      zotprime:
        ipv4_address: 10.5.5.7
  zotprime-dataserver:
    image: "uniuu/zotprime-dataserver:${VER}"
    ports:
      - "8080:8080"
    extra_hosts:
      - "${SERVER_IP}:10.5.5.7"     # Map SERVER_IP to MinIO's internal Docker IP for remote deployments
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      - RUN_USER=apache
      - RUN_GROUP=apache
      - SERVER_IP=${SERVER_IP}
      - S3_ENDPOINT=${S3_ENDPOINT:-${SERVER_IP}:9000} # Default to SERVER_IP:9000, allow override for external S3
      - S3_PUBLIC_ENDPOINT=http://${SERVER_IP}:9000
      - AUTH_SALT=${AUTH_SALT}
      - API_SUPER_TOKEN_HASH=${API_SUPER_TOKEN_HASH}
      - MYSQLROOTPASSWORD=${MYSQLROOTPASSWORD}
      - MYSQLUSER=${MYSQLUSER}
      - MYSQLPASSWORD=${MYSQLPASSWORD}
      - MINIO_ROOT_USER=${MINIOROOTUSER}
      - MINIO_ROOT_PASSWORD=${MINIOROOTPASSWORD}
    depends_on:
      zotprime-db:
        condition: service_healthy
      zotprime-elasticsearch:
        condition: service_healthy
      zotprime-redis:
        condition: service_healthy
      zotprime-memcached:
        condition: service_healthy
      zotprime-minio:
        condition: service_healthy
      zotprime-tinymceclean:
        condition: service_started
      zotprime-streamserver:
        condition: service_started
    links:
      - zotprime-db:mysql
      - zotprime-elasticsearch:elasticsearch
      - zotprime-redis:redis
      - zotprime-memcached:memcached
      - zotprime-localstack:localstack
      - zotprime-minio:minio
      - zotprime-tinymceclean:tinymceclean
      - zotprime-streamserver:streamserver
    restart: always
    networks:
      zotprime:
        aliases:
          - dataserver
        ipv4_address: 10.5.5.8
  zotprime-tinymceclean:
    image: "uniuu/zotprime-tinymceclean:${VER}"
    depends_on:
      - zotprime-db
      - zotprime-elasticsearch
      - zotprime-redis
      - zotprime-memcached
    links:
      - zotprime-redis:redis 
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: always
    networks:
      zotprime:
        ipv4_address: 10.5.5.9
  zotprime-streamserver:
    image: "uniuu/zotprime-streamserver:${VER}"
    ports:
      - "8081:8081"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: always
    depends_on:
      - zotprime-db
      - zotprime-elasticsearch
      - zotprime-redis
      - zotprime-memcached 
    links:
      - zotprime-redis:redis
    networks:
      zotprime:
        ipv4_address: 10.5.5.10
  zotprime-phpmyadmin:
    image: "uniuu/zotprime-phpmyadmin:${VER}"
    ports:
      - "8083:80"
    environment:
      - PMA_HOST=mysql
    links:
      - zotprime-db:mysql
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      zotprime:
        ipv4_address: 10.5.5.11

  zotprime-init:
    image: "uniuu/zotprime-dataserver:${VER}"
    entrypoint: ["/bin/bash"]
    command: ["/auto-init.sh"]
    restart: "no"
    environment:
      - MYSQLROOTPASSWORD=${MYSQLROOTPASSWORD}
      - MYSQLDATABASE=${MYSQLDATABASE}
      - MYSQLUSER=${MYSQLUSER}
      - MYSQLPASSWORD=${MYSQLPASSWORD}
      - AUTH_SALT=${AUTH_SALT}
      - API_SUPER_TOKEN_HASH=${API_SUPER_TOKEN_HASH}
      - MINIO_ROOT_USER=${MINIOROOTUSER}
      - MINIO_ROOT_PASSWORD=${MINIOROOTPASSWORD}
      - AWS_ACCESS_KEY_ID=${MINIOROOTUSER}
      - AWS_SECRET_ACCESS_KEY=${MINIOROOTPASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    volumes:
      - ./stack/init/auto-init.sh:/auto-init.sh:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      zotprime-db:
        condition: service_healthy
      zotprime-elasticsearch:
        condition: service_healthy
      zotprime-redis:
        condition: service_healthy
      zotprime-memcached:
        condition: service_healthy
      zotprime-minio:
        condition: service_healthy
      zotprime-localstack:
        condition: service_started
      zotprime-dataserver:
        condition: service_started
      zotprime-tinymceclean:
        condition: service_started
      zotprime-streamserver:
        condition: service_started
    links:
      - zotprime-db:mysql
      - zotprime-localstack:localstack
      - zotprime-minio:minio
    networks:
      zotprime:
        ipv4_address: 10.5.5.13
  zotprime-admin:
    profiles: ["admin"]
    image: "uniuu/zotprime-admin:${VER}"
    ports:
      - "8082:8080"
    environment:
      - WEBADMIN_USERNAME=${WEBADMIN_USERNAME}
      - WEBADMIN_PASSWORD=${WEBADMIN_PASSWORD}
      - API_SUPER_TOKEN=${API_SUPER_TOKEN}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - admin-data:/var/lib/admin-data
    depends_on:
      zotprime-dataserver:
        condition: service_started
    links:
      - zotprime-dataserver:dataserver
    restart: always
    networks:
      zotprime:
        ipv4_address: 10.5.5.12
  zotprime-portal:
    profiles: ["portal"]
    image: "uniuu/zotprime-portal:${VER}"
    ports:
      - "3045:3000"
    environment:
      - PORTAL_SESSION_SECRET=${PORTAL_SESSION_SECRET}
      - API_SUPER_TOKEN=${API_SUPER_TOKEN}
      - NODE_ENV=production
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./stack/webui/portal/config.yaml:/app/config.yaml:ro
    depends_on:
      zotprime-dataserver:
        condition: service_started
    links:
      - zotprime-dataserver:dataserver
    restart: always
    networks:
      zotprime:
        ipv4_address: 10.5.5.13
volumes:
  dbdata:
   driver: local
  miniodata:
   driver: local
  admin-data:
   driver: local
   
networks:
  zotprime:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.5.0/28
          gateway: 10.5.5.1
