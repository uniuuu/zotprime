{{- if .Values.zotprimePhpmyadmin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  labels:
    apps: phpmyadmin
  {{- include "zotprime-k8s.labels" . | nindent 4 }}
spec:
  type: {{ .Values.phpmyadmin.type }}
  {{- if .Values.phpmyadmin.loadBalancerIP }}
  loadBalancerIP: {{ .Values.phpmyadmin.loadBalancerIP }}
  {{- end }}
  selector:
    apps: zotprime-phpmyadmin
  ports:
	{{- .Values.phpmyadmin.ports | toYaml | nindent 2 -}}
{{- end }}