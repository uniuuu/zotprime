{{- if .Values.basicAuth.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zotprime-k8s.fullname" . }}-zotprime-ingress-protected
  labels:
    apps: zotprime-ingress-protected
  {{- include "zotprime-k8s.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.tls.enabled }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- end }}
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ include "zotprime-k8s.fullname" . }}-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
spec:
  {{- if .Values.tls.enabled }}
  tls:
  - secretName: {{ include "zotprime-k8s.fullname" . }}-tls
    hosts:
    {{- if .Values.zotprimeMinio.exposeWebUI }}
    - {{ .Values.ingressHostnames.minios3Web }}
    {{- end }}
    {{- if .Values.zotprimePhpmyadmin.enabled }}
    - {{ .Values.ingressHostnames.phpmyadmin }}
    {{- end }}
  {{- end }}
  rules:
  {{- if .Values.zotprimeMinio.exposeWebUI }}
  - host: {{ .Values.ingressHostnames.minios3Web }}
    http:
      paths:
      - backend:
          service:
            name: minio
            port:
              name: minio-ui
        path: /
        pathType: Prefix
  {{- end }}
  {{- if .Values.zotprimePhpmyadmin.enabled }}
  - host: {{ .Values.ingressHostnames.phpmyadmin }}
    http:
      paths:
      - backend:
          service:
            name: phpmyadmin
            port:
              number: 80
        path: /
        pathType: Prefix
  {{- end }}
{{- end }}
