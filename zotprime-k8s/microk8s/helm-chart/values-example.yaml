tls:
  enabled: false  # Set to true for HTTPS with cert-manager
ingressHostnames:
  api: yoursub1.yourdomain.tld
  streamserver: yoursub5.yourdomain.tld
  minios3Data: yoursub2.yourdomain.tld
  phpmyadmin: yoursub3.yourdomain.tld
  minios3Web: yoursub4.yourdomain.tld
  admin: yoursub6.yourdomain.tld
  portal: yoursub7.yourdomain.tld
basicAuth:
  # HTTP Basic Authentication at ingress level (network edge protection)
  # Generate: htpasswd -nb username password | base64
  # Format: username:$hashed_password (both in one base64-encoded string)
  enabled: true
  htpasswd: ""
authSecret:
  # Base64 encoded values
  # Generate: echo -n "your_value" | base64
  authSalt: ""  # openssl rand -hex 16 | base64
  apiSuperToken: ""  # openssl rand -hex 32 | base64
  apiSuperTokenHash: ""  # php -r "echo password_hash('YOUR_TOKEN', PASSWORD_BCRYPT);" | base64  -w 0
  appKey: ""  # php -r "echo 'base64:' . base64_encode(random_bytes(32)) . PHP_EOL;" # echo -n "base64:YOUR_KEY" | base64
webAdminConfig:
  # Web Admin UI credentials (matches WEBADMIN_* in .env)
  username: ""  # plain text
webAdminSecret:
  password: ""  # base64 encoded bcrypt hash: echo -n "$(php -r 'echo password_hash(\"your_password\", PASSWORD_BCRYPT);')" | base64
webPortalSecret:
  # Generate: openssl rand -hex 32 (plaintext, helm template will base64 encode it)
  sessionSecret: ""
minioConfig:
  minioRootUser: "zotero" # MINIOROOTUSER
minioSecret:
  secretTxt: ""  # base64 of "MINIO_ROOT_PASSWORD=zoterodocker"  # echo -n "MINIO_ROOT_PASSWORD=zoterodocker" | base64
blobSecret:
  # Blob storage credentials (for dataserver to connect to object storage)
  # When using MinIO: awsAccessKeyId=MINIOROOTUSER, awsSecretAccessKey=MINIOROOTPASSWORD
  # When using cloud blob storage: use your cloud provider's access key and secret
  awsAccessKeyId: ""  # base64 of "zotero"
  awsSecretAccessKey: ""  # base64 of "zoterodocker"
dbConfig:
  mariadbDatabasename: "zoterotest"
  mariadbUser: "zotprimeprod"
dbSecret:
  mariadbRootPassword: ""  # base64 of "zotero" (no newline)
  mariadbPassword: ""  # base64 of "zoterotest" (no newline)
zoteroConfig:
  # Zotero API admin credentials (matches ADMIN_* in .env)
  adminUsername: "admin"
  adminEmail: "admin@zotero.org"
zoteroSecret:
  adminPassword: ""  # base64 of "admin"
dataserver:
  ports:
  - name: dataserver-api
    port: 8080
    targetPort: 8080
  type: ClusterIP
webAdmin:
  enabled: false
  replicas: 1
  image:
    repository: localhost:32000/zotprime-k8s/zotprime-admin
    tag: latest
  imagePullPolicy: Always
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "0.5"
      memory: 256Mi
  service:
    port: 80
    targetPort: 8080
webPortal:
  enabled: false
  replicas: 1
  image:
    repository: localhost:32000/zotprime-k8s/zotprime-portal
    tag: latest
  imagePullPolicy: Always
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: "0.5"
      memory: 256Mi
  service:
    port: 80
    targetPort: 3000
zotprimeDataserver:
  replicas: 1
  zotprimeDataserver:
    env:
      s3Endpoint: minio:9000
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-dataserver
      tag: latest
    imagePullPolicy: Always
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: "1"
        memory: 512Mi
dataserverConfig:
  initSh: |-
    #!/bin/bash
    set -e
    
    echo "ZotPrime Init Starting..."
    
    echo "Waiting for MariaDB..."
    until mariadb -h mysql -u root -p${MARIADB_ROOT_PASSWORD} -e "SELECT 1" >/dev/null 2>&1; do
        sleep 2
    done
    echo "MariaDB ready"
    
    echo "Waiting for MinIO..."
    until aws --endpoint-url "http://minio:9000" s3 ls >/dev/null 2>&1; do
        sleep 2
    done
    echo "MinIO ready"
    
    echo "Waiting for LocalStack..."
    until aws --endpoint-url "http://localstack:4575" sns list-topics >/dev/null 2>&1; do
        sleep 2
    done
    echo "LocalStack ready"
    
    if mariadb -h mysql -u root -p${MARIADB_ROOT_PASSWORD} -e "USE zotero_master; SHOW TABLES;" 2>/dev/null | grep -q "users"; then
        echo "Database already initialized, skipping..."
    else
        echo "Initializing database..."
        cd /var/www/zotero/misc && ./init-mysql.sh
        # cd /var/www/zotero/misc && ./db_update.sh  # Obsolete: master.sql already has hasData column
    fi
    
    echo "Updating database schema..."
    cd /var/www/zotero/admin && php schema_update
    
    echo "Setting up S3 buckets..."
    aws --endpoint-url "http://minio:9000" s3 mb s3://zotero 2>/dev/null || echo "Bucket zotero exists"
    aws --endpoint-url "http://minio:9000" s3 mb s3://zotero-fulltext 2>/dev/null || echo "Bucket zotero-fulltext exists"
    
    echo "Setting up SNS topic..."
    aws --endpoint-url "http://localstack:4575" sns create-topic --name zotero 2>/dev/null || echo "Topic zotero exists"
    
    echo "ZotPrime Init Complete!"
elasticsearch:
  ports:
  - name: elasticsearch
    port: 9300
    targetPort: 0
  type: ClusterIP
kubernetesClusterDomain: cluster.local
localstack:
  ports:
  - name: localstack-sns
    port: 4575
    targetPort: sns-4575
  - name: localstack-sqs
    port: 4576
    targetPort: sqs-4576
  - name: localstack-apigateway
    port: 4567
    targetPort: apigateway-4567
  type: ClusterIP
memcached:
  ports:
  - name: memcached
    port: 11211
    targetPort: 11211
  type: ClusterIP
minio:
  # clusterIP: 10.152.183.11
  ports:
  - name: minio-ui
    port: 9001
    targetPort: 9001
  - name: minio-data
    port: 9000
    targetPort: 9000
  - name: minio-data2
    port: 80
    targetPort: 9000
  type: ClusterIP
mysql:
  ports:
  - name: mariadb
    port: 3306
    targetPort: 3306
  type: ClusterIP
phpmyadmin:
  ports:
  - name: phpmyadmin
    port: 80
    targetPort: 80
  type: ClusterIP
pvc:
  dataminio:
    storageClass: nfs
    storageRequest: 10Gi
redis:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  type: ClusterIP
redisConfig:
  redisConf: |-
    cluster-enabled no
    appendonly yes
    protected-mode no
    dir /data
    port 6379
redisProbes:
  livenessSh: |-
    #!/bin/sh
    pingResponse="$(redis-cli -h localhost ping | head -n1 | awk '{print $1;}')"
    if [ "$?" -eq "124" ]; then
      echo "PING timed out"
      exit 1
    fi
    if [ "$pingResponse" != "PONG"] && [ "$pingResponse" != "LOADING" ] && [ "$pingResponse" != "MASTERDOWN" ]; then
      echo "$pingResponse"
      exit 1
    fi
  readinessSh: |-
    #!/bin/sh
    pingResponse="$(redis-cli -h localhost ping)"
    if [ "$?" -eq "124" ]; then
      echo "PING timed out"
      exit 1
    fi
    if [ "$pingResponse" != "PONG"]; then
      echo "$pingResponse"
      exit 1
    fi
streamserver:
  ports:
  - name: streamserver
    port: 8081
    targetPort: 8081
  type: ClusterIP
tinymceclean:
  ports:
  - name: tinymceclean
    port: 16342
    targetPort: 16342
  type: ClusterIP
zotprimeDb:
  mariadb:
    containerSecurityContext:
      runAsGroup: 999
      runAsUser: 999
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-db
      tag: latest
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 512Mi
  replicas: 1
  takeDataDirOwnership:
    image:
      repository: alpine
      tag: "3"
  volumeClaims:
    datadb:
      requests:
        storage: 2Gi
zotprimeElasticsearch:
  elasticsearch:
    env:
      clusterName: zotero
      clusterRoutingAllocationDiskThresholdEnabled: "false"
      discoveryType: single-node
      xpackSecurityEnabled: "true"
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-elasticsearch
      tag: latest
    resources:
      limits:
        memory: 1536Mi
      requests:
        cpu: "1"
        memory: 1536Mi
  initSysctl:
    containerSecurityContext:
      privileged: true
    image:
      repository: busybox
      tag: 1.27.2
  replicas: 1
  volumeClaims:
    dataes:
      requests:
        storage: 2Gi
zotprimeLocalstack:
  localstack:
    containerSecurityContext: {}
    env:
      debug: "0"
      localstackK8SServiceName: localstack
      services: sns,sqs,apigateway
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-localstack
      tag: latest
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 200m
        memory: 256Mi
  replicas: 1
zotprimeMemcached:
  memcached:
    args:
    - -m 2047
    - -I 50M
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-memcached
      tag: latest
    resources:
      limits:
        memory: 1536Mi
      requests:
        cpu: 200m
        memory: 1536Mi
  replicas: 1
zotprimeMinio:
  enabled: true
  replicas: 1
  zotprimeMinio:
    args:
    - set -o allexport && source /secrets/secret-minio.txt && set +o allexport && minio
      server /data --console-address :9001
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-minio
      tag: latest
    imagePullPolicy: Always
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 512Mi
  zotprimeMiniomc:
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-miniomc
      tag: latest
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 200m
        memory: 256Mi
zotprimePhpmyadmin:
  enabled: true
  phpmyadmin:
    env:
      pmaHost: mysql
      pmaPort: "3306"
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-phpmyadmin
      tag: latest
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 256Mi
zotprimeRedis:
  redis:
    args:
    - /conf/redis.conf
    - --protected-mode
    - "no"
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-redis
      tag: latest
    resources:
      limits:
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 100Mi
  replicas: 1
  volumeClaims:
    dataredis:
      requests:
        storage: 1Gi
zotprimeStreamserver:
  replicas: 1
  zotprimeStreamserver:
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-streamserver
      tag: latest
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: "1"
        memory: 256Mi
zotprimeTinymceclean:
  replicas: 1
  zotprimeTinymceclean:
    image:
      repository: localhost:32000/zotprime-k8s/zotprime-tinymceclean
      tag: latest
    imagePullPolicy: Always
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 256Mi
