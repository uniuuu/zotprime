apiVersion: v1
kind: ConfigMap
metadata:
  name: dataserver-config
  namespace: zotprime
data:
  init.sh: |
    #!/bin/bash
    set -e
    
    echo "ZotPrime Init Starting..."
    
    echo "Waiting for MariaDB..."
    until mysql -h mysql -u root -pzotero -e "SELECT 1" >/dev/null 2>&1; do
        sleep 2
    done
    echo "MariaDB ready"
    
    echo "Waiting for MinIO..."
    until aws --endpoint-url "http://minio:9000" s3 ls >/dev/null 2>&1; do
        sleep 2
    done
    echo "MinIO ready"
    
    echo "Waiting for LocalStack..."
    until aws --endpoint-url "http://localstack:4575" sns list-topics >/dev/null 2>&1; do
        sleep 2
    done
    echo "LocalStack ready"
    
    if mysql -h mysql -u root -pzotero -e "USE zotero_master; SHOW TABLES;" 2>/dev/null | grep -q "users"; then
        echo "Database already initialized, skipping..."
    else
        echo "Initializing database..."
        cd /var/www/zotero/misc && ./init-mysql.sh
        # cd /var/www/zotero/misc && ./db_update.sh  # Obsolete: master.sql already has hasData column
    fi
    
    echo "Updating database schema..."
    cd /var/www/zotero/admin && php schema_update
    
    echo "Setting up S3 buckets..."
    aws --endpoint-url "http://minio:9000" s3 mb s3://zotero 2>/dev/null || echo "Bucket zotero exists"
    aws --endpoint-url "http://minio:9000" s3 mb s3://zotero-fulltext 2>/dev/null || echo "Bucket zotero-fulltext exists"
    
    echo "Setting up SNS topic..."
    aws --endpoint-url "http://localstack:4575" sns create-topic --name zotero 2>/dev/null || echo "Topic zotero exists"
    
    echo "ZotPrime Init Complete!"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    apps: dataserver
  name: dataserver
  namespace: zotprime
spec:
  ports:
    - name: dataserver-api
      port: 80
      targetPort: 80
#    - name: s3
#      port: 8082
#      targetPort: 8082
  selector:
    apps: zotprime-dataserver
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    apps: zotprime-dataserver
  name: zotprime-dataserver
  namespace: zotprime
spec:
  replicas: 1
  selector:
    matchLabels:
      apps: zotprime-dataserver
  strategy: {}
  template:
    metadata:
      labels:
        apps: zotprime-dataserver
      name: zotprime-dataserver
    spec:
      containers:
        - image: uniuu/zotprime-dataserver:v2.8.0
          imagePullPolicy: Always
          name: zotprime-dataserver
          ports:
            - containerPort: 80
#            - containerPort: 8082
          env:
            - name: SERVER_IP
              value: http://api.zotprime/
            - name: S3_ENDPOINT
              value: s3min.zotprime
            - name: AUTH_SALT
              valueFrom:
                secretKeyRef:
                  name: zotprime-auth-secret
                  key: auth-salt
            - name: API_SUPER_TOKEN_HASH
              valueFrom:
                secretKeyRef:
                  name: zotprime-auth-secret
                  key: api-super-token-hash
            - name: MYSQLROOTPASSWORD
              valueFrom:
                secretKeyRef:
                  name: zotprime-db-secret
                  key: mysql-root-password
            - name: MYSQLUSER
              valueFrom:
                configMapKeyRef:
                  name: zotprime-db-config
                  key: mariadb-user
            - name: MYSQLPASSWORD
              valueFrom:
                secretKeyRef:
                  name: zotprime-db-secret
                  key: mysql-password
            - name: MINIOROOTUSER
              valueFrom:
                configMapKeyRef:
                  name: zotprime-minio-config
                  key: minio-root-user
            - name: MINIOROOTPASSWORD
              valueFrom:
                secretKeyRef:
                  name: zotprime-minio-secret
                  key: minio-root-password
          lifecycle:
            postStart:
              exec:
                command: [ "/bin/sh", "-xc", 'mkdir -p /var/www/zotero/log && bash /tmp/_conf/init.sh > /var/www/zotero/log/init.log 2>&1 ; exit 0' ]
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
#            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
            httpGet:
              path: /
              port: 80
          resources:
            limits:
              memory: 512Mi
#              cpu: "0.3"
            requests:
              memory: 512Mi
              cpu: "1"
          volumeMounts:
            - name: dataserver-config
              mountPath: "/tmp/_conf"
              readOnly: true
      priorityClassName: low-priority
      restartPolicy: Always
      hostAliases:
        - ip: "10.152.183.11"
          hostnames:
          - "s3min.zotprime"
      securityContext: {}
      volumes:
        - name: dataserver-config
          configMap:
            name: dataserver-config
status: {}
