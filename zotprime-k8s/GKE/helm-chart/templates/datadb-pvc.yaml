apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "zotprime-k8s.fullname" . }}-datadb
  labels:
  {{- include "zotprime-k8s.labels" . | nindent 4 }}
  {{- if .Values.pvc.datadb.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.datadb.storageRequest | quote }}
  storageClassName: {{ .Values.pvc.datadb.storageClass | quote }}
