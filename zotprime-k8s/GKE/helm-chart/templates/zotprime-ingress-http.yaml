apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zotprime-k8s.fullname" . }}-zotprime-ingress-http
  labels:
    apps: zotprime-ingress-http
  {{- include "zotprime-k8s.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/load-balancer-type: External
    kubernetes.io/ingress.class: gce
    {{- if .Values.tls.enabled }}
    networking.gke.io/managed-certificates: {{ include "zotprime-k8s.fullname" . }}-cert
    {{- end }}
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  {{- if .Values.tls.enabled }}
  tls:
  - secretName: {{ include "zotprime-k8s.fullname" . }}-tls
    hosts:
    - {{ .Values.ingressHostnames.minios3Data }}
    - {{ .Values.ingressHostnames.api }}
  {{- end }}
  rules:
  - host: {{ .Values.ingressHostnames.api }}
    http:
      paths:
      - backend:
          service:
            name: dataserver
            port:
              name: dataserver-api
        path: /
        pathType: Prefix