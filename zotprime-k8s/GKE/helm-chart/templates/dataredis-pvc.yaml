apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "zotprime-k8s.fullname" . }}-dataredis
  labels:
  {{- include "zotprime-k8s.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.dataredis.storageRequest | quote }}
  storageClassName: {{ .Values.pvc.dataredis.storageClass | quote }}
