apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zotprime-k8s.fullname" . }}-zotero-admin-config
  labels:
  {{- include "zotprime-k8s.labels" . | nindent 4 }}
data:
  zotero-admin-username: {{ .Values.zoteroConfig.adminUsername | quote }}
  zotero-admin-email: {{ .Values.zoteroConfig.adminEmail | quote }}
