apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zotprime-k8s.fullname" . }}-zotprime-ingress-websocket
  labels:
    apps: zotprime-ingress-websocket
  {{- include "zotprime-k8s.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/load-balancer-type: External
    kubernetes.io/ingress.class: gce
    {{- if .Values.tls.enabled }}
    networking.gke.io/managed-certificates: {{ include "zotprime-k8s.fullname" . }}-cert
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/server-snippets: |
      location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
      }
spec:
  {{- if .Values.tls.enabled }}
  tls:
  - secretName: {{ include "zotprime-k8s.fullname" . }}-tls
    hosts:
    - {{ .Values.ingressHostnames.streamserver }}
  {{- end }}
  rules:
  - host: {{ .Values.ingressHostnames.streamserver }}
    http:
      paths:
      - backend:
          service:
            name: streamserver
            port:
              name: streamserver
        path: /
        pathType: Prefix