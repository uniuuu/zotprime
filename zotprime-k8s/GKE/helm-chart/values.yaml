basicAuth:
  # HTTP Basic Authentication at ingress level (network edge protection)
  # Generate: htpasswd -nb username password | base64
  # Format: username:$hashed_password (both in one base64-encoded string)
  enabled: true
  htpasswd: ""
authSecret:
  # Base64 encoded values
  # Generate: echo -n "your_value" | base64
  authSalt: ""  # openssl rand -hex 16 | base64
  apiSuperTokenHash: ""  # php -r "echo password_hash('YOUR_TOKEN', PASSWORD_BCRYPT);" | base64
webAdmin:
  # Web Admin UI credentials (matches WEBADMIN_* in .env)
  username: "admin"  # plain text
  password: "YWRtaW4="  # base64 of "admin"
minioConfig:
  minioRootUser: zotero
minioSecret:
  secretTxt: "TUlOSU9fUk9PVF9QQVNTV09SRD16b3Rlcm9kb2NrZXIK"  # base64 of "MINIO_ROOT_PASSWORD=zoterodocker"
blobSecret:
  # Blob storage credentials (for dataserver to connect to object storage)
  # When using MinIO: awsAccessKeyId=MINIOROOTUSER, awsSecretAccessKey=MINIOROOTPASSWORD
  # When using cloud blob storage: use your cloud provider's access key and secret
  awsAccessKeyId: "em90ZXJv"  # base64 of "zotero"
  awsSecretAccessKey: "em90ZXJvZG9ja2Vy"  # base64 of "zoterodocker"
dbConfig:
  mariadbDatabasename: zoterotest
  mariadbUser: zotprimeprod
dbSecret:
  mysqlRootPassword: "em90ZXJv"  # base64 of "zotero" (no newline)
  mysqlPassword: "em90ZXJvdGVzdA=="  # base64 of "zoterotest" (no newline)
zoteroConfig:
  # Zotero API admin credentials (matches ADMIN_* in .env)
  adminUsername: admin
  adminEmail: admin@zotero.org
zoteroSecret:
  adminPassword: "YWRtaW4="  # base64 of "admin"
dataserver:
  ports:
  - name: dataserver-api
    port: 8080
    targetPort: 8080
  type: ClusterIP
webAdmin:
  enabled: true
  replicas: 1
  image:
    repository: uniuu/zotprime-admin
    # tag: v2.8.0  # Image tag is taken from Chart.yaml appVersion. Uncomment to override.
  imagePullPolicy: Always
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "0.5"
      memory: 256Mi
  # Generate: echo -n "your_username" | base64
  username: ""
  # Generate: php -r "echo password_hash('your_password', PASSWORD_BCRYPT, ['cost' => 12]);" | base64 -w 0
  password: ""
  service:
    port: 80
    targetPort: 8080
webPortal:
  enabled: false
  replicas: 1
  image:
    repository: uniuu/zotprime-portal
    # tag: v2.8.0
  imagePullPolicy: Always
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: "0.5"
      memory: 256Mi
  sessionSecret: ""
  service:
    port: 80
    targetPort: 3000
zotprimeDataserver:
  replicas: 1
  hostAliases:
    hostname: s3min.projectdev.net
    ip: 10.30.11.11
  zotprimeDataserver:
    env:
      serverIp: http://api.projectdev.net/
      s3Endpoint: s3min.projectdev.net
    image:
      repository: uniuu/zotprime-dataserver
      # tag: v2.8.0  # Image tag is taken from Chart.yaml appVersion. Uncomment to override.
    imagePullPolicy: Always
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: "1"
        memory: 512Mi
dataserverConfig:
  initSh: |-
    #!/bin/bash
    set -e
    
    echo "ZotPrime Init Starting..."
    
    echo "Waiting for MariaDB..."
    until mariadb -h mysql -u root -pzotero -e "SELECT 1" >/dev/null 2>&1; do
        sleep 2
    done
    echo "MariaDB ready"
    
    echo "Waiting for MinIO..."
    until aws --endpoint-url "http://minio:9000" s3 ls >/dev/null 2>&1; do
        sleep 2
    done
    echo "MinIO ready"
    
    echo "Waiting for LocalStack..."
    until aws --endpoint-url "http://localstack:4575" sns list-topics >/dev/null 2>&1; do
        sleep 2
    done
    echo "LocalStack ready"
    
    if mariadb -h mysql -u root -pzotero -e "USE zotero_master; SHOW TABLES;" 2>/dev/null | grep -q "users"; then
        echo "Database already initialized, skipping..."
    else
        echo "Initializing database..."
        cd /var/www/zotero/misc && ./init-mysql.sh
        # cd /var/www/zotero/misc && ./db_update.sh  # Obsolete: master.sql already has hasData column
    fi
    
    echo "Updating database schema..."
    cd /var/www/zotero/admin && php schema_update
    
    echo "Setting up S3 buckets..."
    aws --endpoint-url "http://minio:9000" s3 mb s3://zotero 2>/dev/null || echo "Bucket zotero exists"
    aws --endpoint-url "http://minio:9000" s3 mb s3://zotero-fulltext 2>/dev/null || echo "Bucket zotero-fulltext exists"
    
    echo "Setting up SNS topic..."
    aws --endpoint-url "http://localstack:4575" sns create-topic --name zotero 2>/dev/null || echo "Topic zotero exists"
    
    echo "ZotPrime Init Complete!"
elasticsearch:
  ports:
  - name: elasticsearch
    port: 9300
    targetPort: 0
  type: ClusterIP
kubernetesClusterDomain: cluster.local
localstack:
  ports:
  - name: localstack-sns
    port: 4575
    targetPort: sns-4575
  - name: localstack-sqs
    port: 4576
    targetPort: sqs-4576
  - name: localstack-apigateway
    port: 4567
    targetPort: apigateway-4567
  type: ClusterIP
memcached:
  ports:
  - name: memcached
    port: 11211
    targetPort: 11211
  type: ClusterIP
minio:
  clusterIP: 10.30.11.11
  ports:
  - name: minio-ui
    port: 9001
    targetPort: 9001
  - name: minio-data
    port: 9000
    targetPort: 9000
  - name: minio-data2
    port: 80
    targetPort: 9000
  type: ClusterIP
mysql:
  ports:
