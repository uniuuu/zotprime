    port: 3306
    targetPort: 3306
  type: ClusterIP
phpmyadmin:
  ports:
  - name: phpmyadmin
    port: 80
    targetPort: 80
  type: ClusterIP
pvc:
  dataminio:
    storageClass: standard-rwo
    storageRequest: 10Gi
redis:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  type: ClusterIP
redisConfig:
  redisConf: |-
    cluster-enabled no
    appendonly yes
    protected-mode no
    dir /data
    port 6379
redisProbes:
  livenessSh: |-
    #!/bin/sh
    pingResponse="$(redis-cli -h localhost ping | head -n1 | awk '{print $1;}')"
    if [ "$?" -eq "124" ]; then
      echo "PING timed out"
      exit 1
    fi
    if [ "$pingResponse" != "PONG"] && [ "$pingResponse" != "LOADING" ] && [ "$pingResponse" != "MASTERDOWN" ]; then
      echo "$pingResponse"
      exit 1
    fi
  readinessSh: |-
    #!/bin/sh
    pingResponse="$(redis-cli -h localhost ping)"
    if [ "$?" -eq "124" ]; then
      echo "PING timed out"
      exit 1
    fi
    if [ "$pingResponse" != "PONG"]; then
      echo "$pingResponse"
      exit 1
    fi
streamserver:
