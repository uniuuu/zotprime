name: Build All Images via Docker Compose

on:
  push:
    paths:
      - '.github/workflows/build-all-images.yml'
      - 'stack/**/*.Dockerfile'
      - 'stack/**/*.dockerignore'
      - 'docker-compose-dev.yml'
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build-all-images.yml'
      - 'stack/**/*.Dockerfile'
      - 'stack/**/*.dockerignore'
      - 'docker-compose-dev.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout submodules
        run: | 
           git submodule update --init stack/dataserver/dataserver
           git submodule update --init stack/stream-server/stream-server
           git submodule update --init stack/tinymce-clean-server/tinymce-clean-server
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest
      - name: Bootstrap config
        run: cp .env_example .env
      - name: Build the stack
        run: BUILDKIT_PROGRESS=plain docker buildx bake -f docker-compose.yml -f docker-compose-dev.yml --set *.platform=linux/amd64,linux/arm64